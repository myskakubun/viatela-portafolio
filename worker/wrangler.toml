name = "preguntale-a-weimar"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
MODEL = "claude-haiku-5-5"
ALLOWED_ORIGINS = "https://portafolio.viatela.com,https://viatela.com,https://www.viatela.com,https://myskakubun.github.io"

# 10 preguntas por minuto por visitante.
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# La clave de Anthropic NO va aquí. Se guarda como secreto:
#   npx wrangler secret put ANTHROPIC_API_KEY
